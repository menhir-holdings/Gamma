<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Gamma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Big+Shoulders+Display:wght@700&family=Big+Shoulders+Text:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --ink: #141414;
      --muted: #6a6764;
      --rule: #e4e4e4;
      --cadmium: #e63e11;
      --pad: max(0.85rem, env(safe-area-inset-top, 0px))
              max(1rem, env(safe-area-inset-right, 0px))
              max(0.85rem, env(safe-area-inset-bottom, 0px))
              max(1rem, env(safe-area-inset-left, 0px));
      --ring: min(260px, 72vw, 38dvh);
      --app-gap: 0.85rem;
      --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
      --font-ui: "Big Shoulders Text", "Arial Narrow", sans-serif;
      --font-mono: "Azeret Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--ink);
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: var(--pad);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-tap-highlight-color: transparent;
    }

    body.dragging { user-select: none; cursor: grabbing; }

    button, input { font: inherit; color: inherit; }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "mast"
        "ring"
        "panel";
      justify-items: center;
      gap: var(--app-gap);
      width: min(440px, 100%);
      max-height: calc(100dvh - 1.5rem);
      min-height: 0;
    }

    .mast {
      grid-area: mast;
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--rule);
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.35rem, 5vw, 1.7rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
    }

    .pigment {
      width: 0.55em;
      height: 0.55em;
      background: var(--cadmium);
      flex-shrink: 0;
    }

    .readout {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .ring-wrap {
      grid-area: ring;
      position: relative;
      width: var(--ring);
      height: var(--ring);
      flex-shrink: 0;
      container-type: size;
    }

    .ring-wrap.dragging #ring { cursor: grabbing; }

    #ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      cursor: crosshair;
      touch-action: none;
      display: block;
    }

    .thumb {
      position: absolute;
      width: clamp(14px, 5.5cqi, 18px);
      height: clamp(14px, 5.5cqi, 18px);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1.5px var(--ink);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .panel {
      grid-area: panel;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .output {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      min-height: 0;
      flex: 1 1 auto;
    }

    .scheme-label {
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .swatch-row {
      display: flex;
      gap: 0.45rem;
      width: 100%;
    }

    .swatch-cell {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .swatch {
      width: 100%;
      height: clamp(4.5rem, 16vw, 6.5rem);
      border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
      border-radius: 2px;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    .swatch:focus-visible,
    .pattern-btn:focus-visible {
      outline: 2px solid var(--cadmium);
      outline-offset: 2px;
    }

    .swatch.copied {
      box-shadow: inset 0 0 0 2px var(--cadmium);
    }

    .hex {
      font-family: var(--font-mono);
      font-size: clamp(0.55rem, 1.35vw, 0.7rem);
      color: var(--muted);
      line-height: 1.2;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .hex.copied { color: var(--cadmium); }

    .sliders {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      flex-shrink: 0;
    }

    .slider-row { display: flex; flex-direction: column; gap: 0.22rem; }
    .slider-row label {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .slider-row label span:last-child {
      font-family: var(--font-mono);
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    input[type="range"] {
      width: 100%;
      height: 1.25rem;
      margin: 0;
      accent-color: var(--cadmium);
      cursor: pointer;
    }

    .pattern-toggle {
      display: flex;
      flex-wrap: wrap;
      gap: 0.1rem 0.85rem;
      width: 100%;
      flex-shrink: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .pattern-btn {
      min-width: 0;
      padding: 0.28rem 0;
      font-family: var(--font-ui);
      font-size: clamp(0.62rem, 2.6vw, 0.72rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.2;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .pattern-btn:hover { color: var(--ink); }
    .pattern-btn.active {
      color: var(--ink);
      border-bottom-color: var(--cadmium);
    }

    @media (max-height: 640px) {
      :root {
        --ring: min(180px, 48vw, 30dvh);
        --app-gap: 0.5rem;
      }

      .panel { gap: 0.5rem; }
      .swatch { height: 3.4rem; }
      .sliders { gap: 0.35rem; }
      .slider-row label { font-size: 0.62rem; }
    }

    @media (max-width: 900px) and (max-height: 520px),
           (orientation: landscape) and (max-height: 520px) {
      :root {
        --ring: min(200px, 38vh, 36vw);
        --app-gap: 0.55rem;
        --pad: max(0.5rem, env(safe-area-inset-top, 0px))
               max(0.75rem, env(safe-area-inset-right, 0px))
               max(0.5rem, env(safe-area-inset-bottom, 0px))
               max(0.75rem, env(safe-area-inset-left, 0px));
      }

      body { align-items: stretch; }

      .app {
        grid-template-columns: var(--ring) minmax(0, 1fr);
        grid-template-areas:
          "mast mast"
          "ring panel";
        gap: 0.5rem 1rem;
        width: min(860px, 100%);
        max-height: calc(100dvh - 1rem);
        height: calc(100dvh - 1rem);
        align-items: center;
      }

      .ring-wrap { align-self: center; }

      .panel {
        height: 100%;
        max-height: 100%;
        gap: 0.45rem;
      }

      .swatch { height: 3.2rem; }
      .swatch-row { gap: 0.3rem; }

      .sliders {
        flex-direction: row;
        gap: 0.65rem;
      }

      .slider-row { flex: 1; min-width: 0; }
    }

    @media (min-width: 720px) and (min-height: 521px) {
      :root {
        --ring: min(300px, 32vw, 46dvh);
        --app-gap: 0.85rem;
        --pad: 1.1rem 1.5rem;
      }

      .app {
        grid-template-columns: var(--ring) minmax(0, 1fr);
        grid-template-areas:
          "mast mast"
          "ring panel";
        gap: 0.85rem 1.75rem;
        width: min(880px, 100%);
        max-height: calc(100dvh - 1.7rem);
        align-items: center;
      }

      .ring-wrap { align-self: center; }

      .panel {
        gap: 0.85rem;
        height: 100%;
        max-height: min(100%, calc(var(--ring) + 5rem));
      }

      .swatch { height: 5.75rem; }

      .sliders {
        flex-direction: row;
        gap: 1rem;
      }

      .slider-row { flex: 1; min-width: 0; }

    }

    @media (min-width: 980px) and (min-height: 700px) {
      :root {
        --ring: min(340px, 28vw, 48dvh);
        --pad: 1.5rem 2rem;
      }

      .app {
        width: min(960px, 100%);
        gap: 1rem 2.25rem;
      }

      .panel { gap: 1rem; }
      .swatch { height: 6.5rem; }
    }

    @media (min-width: 720px) and (max-height: 640px) {
      :root {
        --ring: min(200px, 24vw, 48dvh);
        --app-gap: 0.45rem;
      }

      .panel { gap: 0.45rem; max-height: none; }
      .swatch { height: 3.6rem; }
      .sliders { gap: 0.55rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="mast">
      <div class="wordmark"><span class="pigment" aria-hidden="true"></span>Gamma</div>
      <div class="readout" id="hueVal">0.0°</div>
    </header>

    <div class="ring-wrap" id="ringWrap">
      <canvas id="ring" width="560" height="560"></canvas>
      <div class="thumb" id="thumb"></div>
    </div>

    <div class="panel">
      <div class="output" id="output"></div>

      <div class="sliders">
        <div class="slider-row">
          <label><span>Saturation</span><span id="satVal">65.0</span></label>
          <input type="range" id="saturation" min="0" max="100" step="0.1" value="65" />
        </div>
        <div class="slider-row">
          <label><span>Lightness</span><span id="lightVal">55.0</span></label>
          <input type="range" id="lightness" min="0" max="100" step="0.1" value="55" />
        </div>
      </div>

      <div class="pattern-toggle" id="patternToggle"></div>
    </div>
  </div>
  <script>
    const COF_SEMITONES = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5];
    const PATTERNS = [
      { name: "Power Fifth", semitones: [0, 7] },
      { name: "Major Triad", semitones: [0, 4, 7] },
      { name: "Minor Triad", semitones: [0, 3, 7] },
      { name: "Major Pentatonic", semitones: [0, 2, 4, 7, 9] },
      { name: "Major 7th", semitones: [0, 4, 7, 11] },
      { name: "Dorian", semitones: [0, 3, 7, 9] },
      { name: "Sus4", semitones: [0, 5, 7] },
      { name: "Minor Pentatonic", semitones: [0, 3, 5, 7, 10] },
      { name: "Dom 7th", semitones: [0, 4, 7, 10] },
      { name: "Min 7th", semitones: [0, 3, 7, 10] },
      { name: "Lydian", semitones: [0, 4, 6, 11] },
      { name: "Phrygian", semitones: [0, 1, 3, 7] },
      { name: "Augmented", semitones: [0, 4, 8] },
      { name: "Whole Tone", semitones: [0, 2, 4, 6, 8, 10] },
    ];
    const DEFAULT_STATE = { pattern: 0, baseHue: 0, saturation: 65, lightness: 55 };
    const STORAGE_KEY = "gamma-palette-v1";
    const state = { ...DEFAULT_STATE };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (typeof saved.pattern === "number") state.pattern = saved.pattern;
        if (typeof saved.baseHue === "number") state.baseHue = saved.baseHue;
        if (typeof saved.saturation === "number") state.saturation = saved.saturation;
        if (typeof saved.lightness === "number") state.lightness = saved.lightness;
      } catch (_) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function applyStateToControls() {
      document.getElementById("saturation").value = String(state.saturation);
      document.getElementById("lightness").value = String(state.lightness);
    }
    const canvas = document.getElementById("ring");
    const ringWrap = document.getElementById("ringWrap");
    const ctx = canvas.getContext("2d");
    const thumb = document.getElementById("thumb");
    const SIZE = 280, CX = SIZE, CY = SIZE, OUTER = SIZE - 8, INNER = SIZE - 52;

    function fmtVal(n) { return n.toFixed(1); }
    function semitoneToCofIndex(s) { return COF_SEMITONES.indexOf(((s % 12) + 12) % 12); }
    function cofIndexToHue(k, baseHue) { return (((baseHue + k * 30) % 360) + 360) % 360; }

    function getPalette() {
      const semitones = PATTERNS[state.pattern].semitones;
      const cofIndices = [...new Set(semitones.map(semitoneToCofIndex))].sort((a, b) => a - b);
      return cofIndices.map((k) => {
        const hue = cofIndexToHue(k, state.baseHue);
        return { hue, hex: hslToHex(hue, state.saturation, state.lightness) };
      });
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r, g, b;
      if (h < 60) [r, g, b] = [c, x, 0];
      else if (h < 120) [r, g, b] = [x, c, 0];
      else if (h < 180) [r, g, b] = [0, c, x];
      else if (h < 240) [r, g, b] = [0, x, c];
      else if (h < 300) [r, g, b] = [x, 0, c];
      else [r, g, b] = [c, 0, x];
      const hex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, "0");
      return `#${hex(r)}${hex(g)}${hex(b)}`;
    }

    function drawRing() {
      const scale = canvas.width / (SIZE * 2);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, SIZE * 2, SIZE * 2);
      for (let deg = 0; deg < 360; deg++) {
        const a0 = ((deg - 90) * Math.PI) / 180;
        const a1 = ((deg + 1.2 - 90) * Math.PI) / 180;
        ctx.beginPath();
        ctx.arc(CX, CY, OUTER, a0, a1);
        ctx.arc(CX, CY, INNER, a1, a0, true);
        ctx.closePath();
        ctx.fillStyle = `hsl(${deg}, ${state.saturation}%, 50%)`;
        ctx.fill();
      }
      for (const { hue } of getPalette()) {
        const a = ((hue - 90) * Math.PI) / 180;
        const mx = CX + ((OUTER + INNER) / 2) * Math.cos(a);
        const my = CY + ((OUTER + INNER) / 2) * Math.sin(a);
        ctx.beginPath();
        ctx.arc(mx, my, 7, 0, Math.PI * 2);
        ctx.fillStyle = hslToHex(hue, state.saturation, state.lightness);
        ctx.fill();
        ctx.strokeStyle = "#141414";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function updateThumb() {
      const midR = (OUTER + INNER) / 2;
      const a = ((state.baseHue - 90) * Math.PI) / 180;
      const x = CX + midR * Math.cos(a);
      const y = CY + midR * Math.sin(a);
      thumb.style.left = `${(x / (SIZE * 2)) * 100}%`;
      thumb.style.top = `${(y / (SIZE * 2)) * 100}%`;
      thumb.style.background = hslToHex(state.baseHue, state.saturation, state.lightness);
    }

    function renderPatternToggle() {
      const container = document.getElementById("patternToggle");
      container.innerHTML = PATTERNS.map((p, i) =>
        `<button type="button" class="pattern-btn ${i === state.pattern ? "active" : ""}" data-i="${i}">${p.name}</button>`
      ).join("");
      container.querySelectorAll(".pattern-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.pattern = +btn.dataset.i;
          renderPatternToggle();
          render();
        });
      });
    }

    function bindCopy(root) {
      root.querySelectorAll(".swatch").forEach((el) => {
        el.addEventListener("click", async () => {
          await navigator.clipboard.writeText(el.dataset.hex);
          el.classList.add("copied");
          const hexSpan = el.closest(".swatch-cell")?.querySelector(".hex");
          const prev = hexSpan ? hexSpan.textContent : "";
          if (hexSpan) {
            hexSpan.textContent = "copied";
            hexSpan.classList.add("copied");
          }
          setTimeout(() => {
            el.classList.remove("copied");
            if (hexSpan) {
              hexSpan.textContent = prev;
              hexSpan.classList.remove("copied");
            }
          }, 1200);
        });
      });
    }

    function renderOutput() {
      const name = PATTERNS[state.pattern].name;
      const colors = getPalette();
      document.getElementById("output").innerHTML =
        `<div class="scheme-label">${name}</div>` +
        `<div class="swatch-row">${colors.map((c) =>
          `<div class="swatch-cell">
            <button type="button" class="swatch" data-hex="${c.hex}" aria-label="Copy ${c.hex}" style="background:${c.hex}"></button>
            <span class="hex">${c.hex}</span>
          </div>`
        ).join("")}</div>`;
      bindCopy(document.getElementById("output"));
    }

    function render() {
      drawRing();
      updateThumb();
      renderOutput();
      document.getElementById("satVal").textContent = fmtVal(state.saturation);
      document.getElementById("lightVal").textContent = fmtVal(state.lightness);
      document.getElementById("hueVal").textContent = `${fmtVal(state.baseHue)}°`;
      saveState();
    }

    function ringMetrics() {
      const rect = canvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const minR = (INNER / SIZE) * (rect.width / 2);
      const maxR = rect.width / 2;
      return { cx, cy, minR, maxR };
    }

    function isOnRing(clientX, clientY) {
      const { cx, cy, minR, maxR } = ringMetrics();
      const dist = Math.hypot(clientX - cx, clientY - cy);
      return dist >= minR * 0.72 && dist <= maxR * 1.1;
    }

    function pointerToHue(clientX, clientY) {
      const { cx, cy } = ringMetrics();
      let angle = (Math.atan2(clientY - cy, clientX - cx) * 180) / Math.PI + 90;
      if (angle < 0) angle += 360;
      return angle;
    }

    let dragging = false;
    let activePointerId = null;

    function startDrag(e) {
      if (!isOnRing(e.clientX, e.clientY)) return;
      dragging = true;
      activePointerId = e.pointerId;
      document.body.classList.add("dragging");
      ringWrap.classList.add("dragging");
      canvas.setPointerCapture(e.pointerId);
      state.baseHue = pointerToHue(e.clientX, e.clientY);
      render();
      e.preventDefault();
    }

    function moveDrag(e) {
      if (!dragging || e.pointerId !== activePointerId) return;
      state.baseHue = pointerToHue(e.clientX, e.clientY);
      render();
      e.preventDefault();
    }

    function endDrag(e) {
      if (activePointerId !== null && e.pointerId !== activePointerId) return;
      dragging = false;
      activePointerId = null;
      document.body.classList.remove("dragging");
      ringWrap.classList.remove("dragging");
      try { canvas.releasePointerCapture(e.pointerId); } catch {}
    }

    canvas.addEventListener("pointerdown", startDrag);
    canvas.addEventListener("pointermove", moveDrag);
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);
    window.addEventListener("pointermove", moveDrag);
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);

    document.getElementById("saturation").addEventListener("input", (e) => {
      state.saturation = parseFloat(e.target.value);
      render();
    });
    document.getElementById("lightness").addEventListener("input", (e) => {
      state.lightness = parseFloat(e.target.value);
      render();
    });

    loadState();
    applyStateToControls();
    renderPatternToggle();
    render();
  </script>
</body>
</html>
